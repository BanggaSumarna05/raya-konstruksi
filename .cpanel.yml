---
deployment:
  tasks:
    - export DEPLOYPATH=/home/rayakonstruksi/public_html/raya-konstruksi

    # ── 1. Sync semua file kecuali .env (jangan timpa .env production) ──────
    - /bin/rsync -a --exclude='.env' --exclude='node_modules' --exclude='.git' * $DEPLOYPATH/

    # ── 2. Install PHP dependencies (production only, skip dev) ─────────────
    - cd $DEPLOYPATH && /usr/local/bin/php -d allow_url_fopen=On /usr/local/bin/composer install --optimize-autoloader --no-dev --no-interaction --quiet

    # ── 3. Jalankan migrasi database ─────────────────────────────────────────
    - cd $DEPLOYPATH && /usr/local/bin/php artisan migrate --force --quiet

    # ── 4. Clear semua cache lama ────────────────────────────────────────────
    - cd $DEPLOYPATH && /usr/local/bin/php artisan cache:clear
    - cd $DEPLOYPATH && /usr/local/bin/php artisan config:clear
    - cd $DEPLOYPATH && /usr/local/bin/php artisan route:clear
    - cd $DEPLOYPATH && /usr/local/bin/php artisan view:clear

    # ── 5. Rebuild cache untuk production ────────────────────────────────────
    - cd $DEPLOYPATH && /usr/local/bin/php artisan config:cache
    - cd $DEPLOYPATH && /usr/local/bin/php artisan route:cache
    - cd $DEPLOYPATH && /usr/local/bin/php artisan view:cache
    - cd $DEPLOYPATH && /usr/local/bin/php artisan event:cache

    # ── 6. Pastikan storage symlink ada ──────────────────────────────────────
    - cd $DEPLOYPATH && /usr/local/bin/php artisan storage:link --quiet 2>/dev/null || true

    # ── 7. Set permission folder yang dibutuhkan Laravel ─────────────────────
    - chmod -R 775 $DEPLOYPATH/storage
    - chmod -R 775 $DEPLOYPATH/bootstrap/cache

    # ── 8. Sync public assets ke public_html root agar URL /build/ & /assets/ bisa diakses ──
    - /bin/cp -R $DEPLOYPATH/public/build/. /home/rayakonstruksi/public_html/build/
    - /bin/cp -R $DEPLOYPATH/public/assets/. /home/rayakonstruksi/public_html/assets/
    - /bin/cp $DEPLOYPATH/public/icon.png /home/rayakonstruksi/public_html/icon.png 2>/dev/null || true
